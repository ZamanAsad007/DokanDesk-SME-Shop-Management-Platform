services:
  postgres:
    image: postgres:16-alpine
    container_name: dokandesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dokandesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokandesk_dev_secret_local}
      POSTGRES_DB: ${POSTGRES_DB:-dokandesk_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-dokandesk_user} -d ${POSTGRES_DB:-dokandesk_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dokandesk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: dokandesk-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db

volumes:
  postgres_data:
    name: dokandesk_postgres_data
  redis_data:
    name: dokandesk_redis_data
  mailpit_data:
    name: dokandesk_mailpit_data
